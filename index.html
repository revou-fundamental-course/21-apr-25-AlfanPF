<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Suhu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Kalkulator Konversi Suhu</h1>
        <form id="form-konversi">
            <label for="suhu">Masukkan Suhu:</label>
            <input type="number" id="suhu" placeholder="Contoh: 100" required>

            <label for="konversi">Konversi ke:</label>
            <select id="konversi">
                <option value="fahrenheit">Fahrenheit</option>
                <option value="celsius">Celsius</option>
            </select>

            <button type="submit">Konversi</button>
        </form>

        <div class="hasil" id="hasil"></div>

        <div class="penjelasan" id="penjelasan"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
